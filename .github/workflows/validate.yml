name: Validate submitted data
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: validator
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: incoming
          persist-credentials: false
      - name: Validate data with trusted base validator
        run: |
          python validator/tools/package.py incoming/examples --all
          if [ -d incoming/featured ]; then python validator/tools/package.py incoming/featured --all; fi
